{% extends 'header.html' %}
{% load static %}

{% block content %}
<div class="chess-wrapper" style="text-align: center; margin-top: 20px;">
    <h2>{{ tactic.title }}</h2>
    <p>{{ tactic.description }}</p>

    <!-- Основной контейнер с сеткой: слева доска, справа список ходов -->
    <div style="display: flex; justify-content: center; align-items: flex-start; gap: 30px; flex-wrap: wrap; margin-top: 20px;">
        
        <!-- Левая колонка: Доска и кнопки управления -->
        <div>
            <div id="board" style="width: 350px; margin: 0 auto;"></div>

            <div style="margin-top: 15px;">
                <button id="prev-btn" class="chess-btn">◀ Назад</button>
                <span id="step-info" style="margin: 0 10px; font-weight: bold; font-size: 0.9em;">Шаг 0</span>
                <button id="next-btn" class="chess-btn">Вперед ▶</button>
            </div>
        </div>

        <!-- Правая колонка: Список ходов и кнопка выбора варианта -->
        <div style="width: 250px; background: rgba(0,0,0,0.02); border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: left; min-height: 300px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h4 style="margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 5px;">Ходы партии</h4>
                <!-- Блок, куда JS будет выводить список ходов столбиком -->
                <div id="moves-list-container" style="max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 1.1em; line-height: 1.6;">
                    <p style="color: #7f8c8d; font-style: italic;">Игра не начата</p>
                </div>
            </div>

            <!-- Блок для кнопки выбора варианта / развилки -->
            <div id="branch-container" style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; display: none;">
                <p style="font-weight: bold; font-size: 0.85em; color: #e67e22; margin-bottom: 5px;">Развилка:</p>
                <div id="branch-buttons" style="display: flex; flex-direction: column; gap: 5px;"></div>
            </div>
        </div>

    </div>

    <script>
        window.TacticConfig = {
            fen: "{{ tactic.fen }}",
            solutionMoves: {{ moves_list|safe }}
        };
    </script>
</div>
{% endblock %}
