{% extends 'header.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/tactic_detail.css' %}">

<div class="chess-tactic-wrapper">
    <div class="chess-content-container">
        <h2>{{ tactic.title }}</h2>
        <p>{{ tactic.description }}</p>

        <div class="chess-layout">
            
            <div class="chess-board-column">
                <div class="chess-board-wrapper-inner">
                    <div id="board" class="chess-board-container"></div>
                </div>
            
                <div class="chess-controls">
                    <button id="prev-btn" class="chess-btn">◀ Назад</button>
                    <span id="step-info" class="chess-step-info">Шаг 0</span>
                    <button id="next-btn" class="chess-btn">Вперед ▶</button>
                </div>
            </div>

            <!-- Правая колонка: Ходы и развилки (теперь строго справа) -->
            <div class="chess-sidebar">
                <div>
                    <h4>Ходы партии</h4>
                    <div id="moves-list-container" class="moves-list-scroll">
                        <p class="moves-placeholder">Игра не начата</p>
                    </div>
                </div>

                <div id="branch-container" class="branch-box">
                    <p class="branch-title">Развилка:</p>
                    <div id="branch-buttons" class="branch-buttons-group"></div>
                </div>
            </div>

        </div>
    </div>

    {{ tactic.moves_sequence|json_script:"tactic-moves-data" }}

    <script>
        const rawMoves = document.getElementById('tactic-moves-data').textContent;
        window.TacticConfig = {
            fen: "{{ tactic.fen }}",
            solutionMoves: JSON.parse(rawMoves)
        };
    </script>
    
    <script src="{% static 'js/tactic_detail.js' %}" defer></script>
</div>
{% endblock %}
