{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess Tactic Library</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <script src="https://code.jquery.com/jquery-3.5.1.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" defer></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" defer></script>

    <script src="{% static 'js/theme.js' %}" defer></script>
    <script src="{% static 'js/game.js' %}" defer></script>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <div class="logo">Chess Tactic Library</div>
            <link rel="stylesheet" href="{% static 'css/header.css' %}">
            <link rel="stylesheet" href="{% static 'css/main.css' %}">
            <link rel="stylesheet" href="{% static 'css/profile.css' %}">
            <nav class="menu">
                <button id="theme-toggle" class="theme-btn" title="Сменить тему">🌕</button>
                <a href="{% url 'Main' %}">Home</a>
                <a href="{% url 'Profile' %}">Profile</a>
                <a href="{% url 'chess_board' %}">Games</a>
            </nav>
        </div>
    </header>

    {% block content %}
    {% endblock %}

</body>
</html>
