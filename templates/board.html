{% extends 'header.html' %}
{% load static %}

{% block content %}
<div style="text-align: center; margin-top: 30px;">
    <h1>Шахматная партия</h1>
    <div id="board" style="width: 400px; margin: 0 auto;"></div>
    <div id="status" style="margin-top: 15px; font-weight: bold; font-size: 1.1em;">Загрузка игры...</div>
</div>

<script>
    window.DjangoChessConfig = {
        fen: "{{ game.fen }}",
        csrfToken: "{{ csrf_token }}",
        updateUrl: "{% url 'update_game' game.id %}"
    };
</script>
{% endblock %}
